services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: researchdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d researchdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  tensorzero:
    build:
      context: .
      dockerfile: tensorzero/Dockerfile
    environment:
      GOOGLE_AI_STUDIO_GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "3000:3000"

  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file:
      - .env
    environment:
      START_WORKER: "false"
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/researchdb
      TENSORZERO_URL: http://tensorzero:3000
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      tensorzero:
        condition: service_started
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file:
      - .env
    environment:
      START_WORKER: "true"
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/researchdb
      TENSORZERO_URL: http://tensorzero:3000
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      tensorzero:
        condition: service_started
    command: ["python", "-m", "app.worker"]

volumes:
  postgres_data:
