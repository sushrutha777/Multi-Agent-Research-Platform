[project]
name = "agentic-ai-research-platform"
version = "0.2.0"
description = "Real-time multi-agent web research and reporting platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.138.1",
    "uvicorn[standard]==0.49.0",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "redis[hiredis]==8.0.1",
    "langgraph==1.2.6",
    "langchain-core==1.4.8",
    "boto3==1.43.36",
    "asyncpg==0.31.0",
    "reportlab==4.2.0",
    "langsmith==0.9.3",
    "python-dotenv==1.1.1",
]

[project.optional-dependencies]
test = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "fakeredis==2.31.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
